# Run `docker compose --profile build build` once to build the agent image.
name: sdlc-agent

services:
  postgres:
    image: postgres:17.12@sha256:0d938e975177bef9f1f61f3f9dbcf2e0aa0a139568f66d3415ed8892eb97f6ac
    restart: unless-stopped
    environment:
      POSTGRES_USER: sdlc
      POSTGRES_DB: sdlc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Port not published: only the api and worker reach Postgres, on the internal network. Dev mode adds a loopback port (docker-compose.dev.yml).
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sdlc -d sdlc"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      DATABASE_URL: postgresql://sdlc:${POSTGRES_PASSWORD}@postgres:5432/sdlc
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD:-}
      SETUP_CODE: ${SETUP_CODE:-}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set ENCRYPTION_KEY in .env (openssl rand -base64 32)}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
      JIRA_BASE_URL: ${JIRA_BASE_URL:-}
      JIRA_EMAIL: ${JIRA_EMAIL:-}
      JIRA_API_TOKEN: ${JIRA_API_TOKEN:-}
      DATA_DIR: ${DATA_DIR:?set DATA_DIR in .env}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - ./guidelines:/app/guidelines
      - ${DATA_DIR}:${DATA_DIR}:ro
    networks: [internal]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20

  worker:
    build:
      context: .
      dockerfile: docker/worker/Dockerfile
    restart: unless-stopped
    user: root
    healthcheck:
      # Fails when the worker's heartbeat is older than 30 s, so `docker ps` shows a hung worker as unhealthy.
      test: ["CMD", "node", "dist/scripts/worker-health.js"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 60s
    depends_on:
      api: { condition: service_healthy }
      docker-proxy: { condition: service_started }
    environment:
      DATABASE_URL: postgresql://sdlc:${POSTGRES_PASSWORD}@postgres:5432/sdlc
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set ENCRYPTION_KEY in .env (openssl rand -base64 32)}
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GIT_AUTHOR_NAME: ${GIT_AUTHOR_NAME:-}
      GIT_AUTHOR_EMAIL: ${GIT_AUTHOR_EMAIL:-}
      JIRA_BASE_URL: ${JIRA_BASE_URL:-}
      JIRA_EMAIL: ${JIRA_EMAIL:-}
      JIRA_API_TOKEN: ${JIRA_API_TOKEN:-}
      DATA_DIR: ${DATA_DIR:?set DATA_DIR in .env}
      # Not the Docker socket: a filtering proxy that refuses privileged containers, host mounts and anything but the calls the worker needs.
      DOCKER_HOST: tcp://docker-proxy:2375
      AGENT_IMAGE: ${AGENT_IMAGE:-sdlc-agent/agent:latest}
      # Optional stronger sandbox for agent containers, once installed on the Docker host: runsc (gVisor) or sysbox-runc.
      AGENT_RUNTIME: ${AGENT_RUNTIME:-}
      AGENT_MEMORY: ${AGENT_MEMORY:-4g}
      AGENT_CPUS: ${AGENT_CPUS:-2}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - ${DATA_DIR}:${DATA_DIR}
      - ./guidelines:/app/guidelines:ro
    # On the agent network the worker answers as `llm-gateway` (port 8080): agents send their model calls there instead of holding the Claude token.
    networks:
      internal: {}
      egress: {}
      docker_api: {}
      agent_net:
        aliases: [llm-gateway]

  docker-proxy:
    build: docker/socket-proxy
    restart: unless-stopped
    user: root
    environment:
      ALLOWED_BIND_ROOTS: ${DATA_DIR:?set DATA_DIR in .env}
      # Only the agent image can be pulled, inspected or run.
      ALLOWED_IMAGES: ${AGENT_IMAGE:-sdlc-agent/agent:latest}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    # Its own network, shared with the worker only: the api, dashboard and agents cannot reach it.
    networks: [docker_api]

  dashboard:
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile
    restart: unless-stopped
    environment:
      # Names the dashboard answers to besides localhost (a public name behind a TLS proxy). Other Host headers get 421.
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-}
    ports:
      - "${DASHBOARD_BIND:-127.0.0.1}:3000:3000"
    networks: [internal]

  proxy:
    build: docker/proxy
    restart: unless-stopped
    networks: [agent_net, egress]

  # Read-only npm mirror (Verdaccio in proxy mode, publishing refused). Agents install from here and cannot reach registry.npmjs.org,
  # so a prompt-injected agent cannot `npm publish` the repository with its own token.
  npm-mirror:
    image: verdaccio/verdaccio:6.1.6@sha256:44af8dec4b8bfb9b940263f56ee5f371484515e4397eea56ab9c942500ab9dfa
    restart: unless-stopped
    volumes:
      - ./docker/npm-mirror/config.yaml:/verdaccio/conf/config.yaml:ro
      - npm_mirror:/verdaccio/storage
    networks: [agent_net, egress]

  # Build only: `docker compose --profile build build` produces sdlc-agent/agent:latest.
  agent-image:
    profiles: [build]
    build:
      context: docker/agent
      args:
        CLAUDE_CODE_VERSION: ${CLAUDE_CODE_VERSION:-2.1.322}
    image: ${AGENT_IMAGE:-sdlc-agent/agent:latest}
    network_mode: none
    command: ["true"]

networks:
  internal: {}
  # The worker <-> docker-proxy link and nothing else.
  docker_api:
    internal: true
  # Agent containers attach only to this network, so they can reach nothing except the proxy.
  agent_net:
    name: sdlc_agent_net
    internal: true
  egress: {}

volumes:
  pgdata: {}
  npm_mirror:
    name: sdlc_npm_mirror
  # Shared npm cache for agent containers (mounted at /npm-cache); created now, used from milestone 3.
  npm_cache:
    name: sdlc_npm_cache
