# Egress allowlist for agent containers.
# Anthropic is not allowed here: agents call the worker's LLM gateway (llm-gateway:8080, no Anthropic API key in the container), which only
# forwards POST /v1/messages. The npm registry is not allowed either: agents install from the read-only npm-mirror (Verdaccio, publishing
# refused). Both are reached directly on the agent network, not through this proxy. A hostname allowlist cannot tell an install from a
# publish, or a message from a Files API upload, which is why those two hosts are gone.
# Prisma's `prisma generate` (run by npm postinstall in target repos) fetches engine checksums from binaries.prisma.sh.
# Agents reach nothing through port 3128 but Prisma's binary host. Jira, Confluence and GitHub are called by the worker, never by agents
# (connector mode excepted, through port 3129, below).
http_port 3128
# Port 3129 serves only the Jira connector stage (connector mode): it signs in to claude.ai with its own login, because claude.ai
# connectors do not load through the gateway. It reaches Anthropic's API, claude.ai (the connector list and login refresh) and
# Anthropic's MCP proxy, which forwards the connector's tool calls to Atlassian. Nothing else, and no workspace is mounted in that stage.
http_port 3129
acl base_domains dstdomain binaries.prisma.sh
acl connector_domains dstdomain api.anthropic.com claude.ai platform.claude.com mcp-proxy.anthropic.com
acl port_base localport 3128
acl port_connector localport 3129
acl ssl_ports port 443
acl connect_method method CONNECT
http_access deny connect_method !ssl_ports
# Only HTTPS tunnels (CONNECT to 443): plain-HTTP requests to allowlisted domains are refused too.
http_access deny !connect_method
http_access allow port_base base_domains
http_access allow port_connector connector_domains
http_access deny all
