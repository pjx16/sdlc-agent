# Release install: runs the published images. Set SDLC_VERSION in .env. The worker pulls the agent image on first start.
# Only docker-proxy touches the Docker socket; agents reach the model through the worker's LLM gateway and npm through the read-only mirror.
# The services and security properties match the root docker-compose.yml, which builds from source.
name: sdlc-agent

services:
  postgres:
    image: postgres:17.11@sha256:ff87138949ad9a46f32ff23bd6852b52ce024a13dffe9b4087be98292cdd3b4f
    restart: unless-stopped
    environment:
      POSTGRES_USER: sdlc
      POSTGRES_DB: sdlc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Port not published: only the api and worker reach Postgres, on the internal network. From the host use `docker compose exec postgres psql -U sdlc sdlc`.
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sdlc -d sdlc"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    image: ${SDLC_REGISTRY:-ghcr.io/pjx16}/sdlc-agent-api:${SDLC_VERSION:?set SDLC_VERSION in .env}
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      DATABASE_URL: postgresql://sdlc:${POSTGRES_PASSWORD}@postgres:5432/sdlc
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD:-}
      SETUP_CODE: ${SETUP_CODE:-}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set ENCRYPTION_KEY in .env (openssl rand -base64 32)}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
      JIRA_BASE_URL: ${JIRA_BASE_URL:-}
      JIRA_EMAIL: ${JIRA_EMAIL:-}
      JIRA_API_TOKEN: ${JIRA_API_TOKEN:-}
      DATA_DIR: ${DATA_DIR:?set DATA_DIR in .env}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - ./guidelines:/app/guidelines
      - ${DATA_DIR}:${DATA_DIR}:ro
    networks: [internal]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20

  worker:
    image: ${SDLC_REGISTRY:-ghcr.io/pjx16}/sdlc-agent-worker:${SDLC_VERSION:?set SDLC_VERSION in .env}
    restart: unless-stopped
    user: root
    healthcheck:
      # Fails when the worker's heartbeat is older than 30 s, so `docker ps` shows a hung worker as unhealthy.
      test: ["CMD", "node", "dist/scripts/worker-health.js"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 60s
    depends_on:
      api: { condition: service_healthy }
      docker-proxy: { condition: service_started }
    environment:
      DATABASE_URL: postgresql://sdlc:${POSTGRES_PASSWORD}@postgres:5432/sdlc
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set ENCRYPTION_KEY in .env (openssl rand -base64 32)}
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GIT_AUTHOR_NAME: ${GIT_AUTHOR_NAME:-}
      GIT_AUTHOR_EMAIL: ${GIT_AUTHOR_EMAIL:-}
      JIRA_BASE_URL: ${JIRA_BASE_URL:-}
      JIRA_EMAIL: ${JIRA_EMAIL:-}
      JIRA_API_TOKEN: ${JIRA_API_TOKEN:-}
      DATA_DIR: ${DATA_DIR:?set DATA_DIR in .env}
      # Not the Docker socket: a filtering proxy that refuses privileged containers, host mounts and anything but the calls the worker needs.
      DOCKER_HOST: tcp://docker-proxy:2375
      # Optional stronger sandbox for agent containers, once installed on the Docker host: runsc (gVisor) or sysbox-runc.
      AGENT_RUNTIME: ${AGENT_RUNTIME:-}
      AGENT_IMAGE: ${AGENT_IMAGE:-${SDLC_REGISTRY:-ghcr.io/pjx16}/sdlc-agent-agent:${SDLC_VERSION}}
      AGENT_MEMORY: ${AGENT_MEMORY:-4g}
      AGENT_CPUS: ${AGENT_CPUS:-2}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - ${DATA_DIR}:${DATA_DIR}
      - ./guidelines:/app/guidelines:ro
    # On the agent network the worker answers as `llm-gateway` (port 8080): agents send their model calls there instead of holding the Claude token.
    networks:
      internal: {}
      egress: {}
      agent_net:
        aliases: [llm-gateway]

  docker-proxy:
    image: ${SDLC_REGISTRY:-ghcr.io/pjx16}/sdlc-agent-docker-proxy:${SDLC_VERSION:?set SDLC_VERSION in .env}
    restart: unless-stopped
    user: root
    environment:
      ALLOWED_BIND_ROOTS: ${DATA_DIR:?set DATA_DIR in .env}
    volumes:
      - ${DOCKER_SOCK:-/var/run/docker.sock}:/var/run/docker.sock
    networks: [internal]

  dashboard:
    image: ${SDLC_REGISTRY:-ghcr.io/pjx16}/sdlc-agent-dashboard:${SDLC_VERSION:?set SDLC_VERSION in .env}
    restart: unless-stopped
    environment:
      # Names the dashboard answers to besides localhost (a public name behind a TLS proxy). Other Host headers get 421.
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-}
    ports:
      - "${DASHBOARD_BIND:-127.0.0.1}:3000:3000"
    networks: [internal]

  proxy:
    image: ${SDLC_REGISTRY:-ghcr.io/pjx16}/sdlc-agent-proxy:${SDLC_VERSION:?set SDLC_VERSION in .env}
    restart: unless-stopped
    networks: [agent_net, egress]

  # Read-only npm mirror (Verdaccio in proxy mode, publishing refused). Agents install from here and cannot reach registry.npmjs.org.
  npm-mirror:
    image: ${SDLC_REGISTRY:-ghcr.io/pjx16}/sdlc-agent-npm-mirror:${SDLC_VERSION:?set SDLC_VERSION in .env}
    restart: unless-stopped
    volumes:
      - npm_mirror:/verdaccio/storage
    networks: [agent_net, egress]

networks:
  internal: {}
  # Agent containers attach only to this network, so they can reach nothing except the LLM gateway, the npm mirror and the proxy.
  agent_net:
    name: sdlc_agent_net
    internal: true
  egress: {}

volumes:
  pgdata: {}
  npm_mirror:
    name: sdlc_npm_mirror
  # Shared npm cache for agent containers (mounted at /npm-cache); created now, used from milestone 3.
  npm_cache:
    name: sdlc_npm_cache
