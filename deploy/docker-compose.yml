# Release install: runs the published images. Set SDLC_VERSION in .env.
# The agent image is not published (it bundles Claude Code, which is not ours to redistribute): `sdlc-agent up` builds it from ./docker/agent,
# or run `docker compose --profile build build agent-image` yourself.
# Only docker-proxy touches the Docker socket; agents reach the model through the worker's LLM gateway and npm through the read-only mirror.
# The services and security properties match the root docker-compose.yml, which builds from source.
name: sdlc-agent

# Every service gets no-new-privileges. Services that run as an unprivileged user (or need no capability) also drop all capabilities.
x-no-new-privileges: &nnp
  security_opt: ["no-new-privileges:true"]
x-unprivileged: &unprivileged
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]

services:
  postgres:
    <<: *nnp
    image: postgres:17.12@sha256:0d938e975177bef9f1f61f3f9dbcf2e0aa0a139568f66d3415ed8892eb97f6ac
    restart: unless-stopped
    environment:
      POSTGRES_USER: sdlc
      POSTGRES_DB: sdlc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Port not published: only the api and worker reach Postgres, on the internal network. From the host use `docker compose exec postgres psql -U sdlc sdlc`.
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sdlc -d sdlc"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    <<: *unprivileged
    image: ${SDLC_REGISTRY:-ghcr.io/pjx16}/sdlc-agent-api:${SDLC_VERSION:?set SDLC_VERSION in .env}
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      DATABASE_URL: postgresql://sdlc:${POSTGRES_PASSWORD}@postgres:5432/sdlc
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD:-}
      SETUP_CODE: ${SETUP_CODE:-}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set ENCRYPTION_KEY in .env (openssl rand -base64 32)}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
      JIRA_BASE_URL: ${JIRA_BASE_URL:-}
      JIRA_EMAIL: ${JIRA_EMAIL:-}
      JIRA_API_TOKEN: ${JIRA_API_TOKEN:-}
      JIRA_MCP_URL: ${JIRA_MCP_URL:-}
      JIRA_MCP_TOKEN: ${JIRA_MCP_TOKEN:-}
      JIRA_MCP_OAUTH: ${JIRA_MCP_OAUTH:-}
      JIRA_CLOUD_ID: ${JIRA_CLOUD_ID:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LLM_GATEWAY_UPSTREAM: ${LLM_GATEWAY_UPSTREAM:-}
      # The data folder is the sdlc_data volume, not a host folder: no repository code is written to the host disk.
      DATA_DIR: /data
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - ./guidelines:/app/guidelines
      - data:/data:ro
    networks: [internal]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20

  worker:
    <<: *nnp
    image: ${SDLC_REGISTRY:-ghcr.io/pjx16}/sdlc-agent-worker:${SDLC_VERSION:?set SDLC_VERSION in .env}
    restart: unless-stopped
    user: root
    healthcheck:
      # Fails when the worker's heartbeat is older than 30 s, so `docker ps` shows a hung worker as unhealthy.
      test: ["CMD", "node", "dist/scripts/worker-health.js"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 60s
    depends_on:
      api: { condition: service_healthy }
      docker-proxy: { condition: service_started }
    environment:
      DATABASE_URL: postgresql://sdlc:${POSTGRES_PASSWORD}@postgres:5432/sdlc
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set ENCRYPTION_KEY in .env (openssl rand -base64 32)}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LLM_GATEWAY_UPSTREAM: ${LLM_GATEWAY_UPSTREAM:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GIT_AUTHOR_NAME: ${GIT_AUTHOR_NAME:-}
      GIT_AUTHOR_EMAIL: ${GIT_AUTHOR_EMAIL:-}
      JIRA_BASE_URL: ${JIRA_BASE_URL:-}
      JIRA_EMAIL: ${JIRA_EMAIL:-}
      JIRA_API_TOKEN: ${JIRA_API_TOKEN:-}
      JIRA_MCP_URL: ${JIRA_MCP_URL:-}
      JIRA_MCP_TOKEN: ${JIRA_MCP_TOKEN:-}
      JIRA_MCP_OAUTH: ${JIRA_MCP_OAUTH:-}
      JIRA_CLOUD_ID: ${JIRA_CLOUD_ID:-}
      # Mirrors, workspaces and run logs live in the sdlc_data volume; agent containers mount sub-paths of it.
      DATA_DIR: /data
      DATA_VOLUME: sdlc_data
      # Not the Docker socket: a filtering proxy that refuses privileged containers, host mounts and anything but the calls the worker needs.
      DOCKER_HOST: tcp://docker-proxy:2375
      # Optional stronger sandbox for agent containers, once installed on the Docker host: runsc (gVisor) or sysbox-runc.
      AGENT_RUNTIME: ${AGENT_RUNTIME:-}
      # Built locally by `sdlc-agent up` (the agent-image service below); set AGENT_IMAGE to use an image you build and host yourself.
      AGENT_IMAGE: ${AGENT_IMAGE:-sdlc-agent/agent:${SDLC_VERSION}}
      AGENT_MEMORY: ${AGENT_MEMORY:-4g}
      AGENT_CPUS: ${AGENT_CPUS:-2}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - data:/data
      - ./guidelines:/app/guidelines:ro
    # On the agent network the worker answers as `llm-gateway` (port 8080): agents send their model calls there instead of holding the Claude token.
    networks:
      internal: {}
      egress: {}
      docker_api: {}
      agent_net:
        aliases: [llm-gateway]

  docker-proxy:
    <<: *unprivileged
    # It only forwards checked requests to the socket: nothing in the container is written.
    read_only: true
    image: ${SDLC_REGISTRY:-ghcr.io/pjx16}/sdlc-agent-docker-proxy:${SDLC_VERSION:?set SDLC_VERSION in .env}
    restart: unless-stopped
    user: root
    environment:
      # Agents may mount sub-paths of the data volume and nothing from the host.
      ALLOWED_DATA_VOLUME: sdlc_data
      # Only the agent image can be pulled, inspected or run.
      ALLOWED_IMAGES: ${AGENT_IMAGE:-sdlc-agent/agent:${SDLC_VERSION}}
    volumes:
      - ${DOCKER_SOCK:-/var/run/docker.sock}:/var/run/docker.sock
    # Its own network, shared with the worker only: the api, dashboard and agents cannot reach it.
    networks: [docker_api]

  dashboard:
    <<: *unprivileged
    image: ${SDLC_REGISTRY:-ghcr.io/pjx16}/sdlc-agent-dashboard:${SDLC_VERSION:?set SDLC_VERSION in .env}
    restart: unless-stopped
    environment:
      # Names the dashboard answers to besides localhost (a public name behind a TLS proxy). Other Host headers get 421.
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-}
    ports:
      - "${DASHBOARD_BIND:-127.0.0.1}:3000:3000"
    networks: [internal]

  proxy:
    <<: *nnp
    image: ${SDLC_REGISTRY:-ghcr.io/pjx16}/sdlc-agent-proxy:${SDLC_VERSION:?set SDLC_VERSION in .env}
    restart: unless-stopped
    networks: [agent_net, egress]

  # Read-only npm mirror (Verdaccio in proxy mode, publishing refused). Agents install from here and cannot reach registry.npmjs.org.
  npm-mirror:
    <<: *nnp
    image: ${SDLC_REGISTRY:-ghcr.io/pjx16}/sdlc-agent-npm-mirror:${SDLC_VERSION:?set SDLC_VERSION in .env}
    restart: unless-stopped
    volumes:
      - npm_mirror:/verdaccio/storage
    networks: [agent_net, egress]

  # Build only: `docker compose --profile build build agent-image` produces sdlc-agent/agent:${SDLC_VERSION}. Docker fetches the build
  # files from the release's git tag itself, so they never land on the host.
  agent-image:
    profiles: [build]
    build:
      context: https://github.com/pjx16/sdlc-agent.git#v${SDLC_VERSION}:docker/agent
    image: ${AGENT_IMAGE:-sdlc-agent/agent:${SDLC_VERSION:?set SDLC_VERSION in .env}}
    network_mode: none
    command: ["true"]

networks:
  internal: {}
  # The worker <-> docker-proxy link and nothing else.
  docker_api:
    internal: true
  # Agent containers attach only to this network, so they can reach nothing except the LLM gateway, the npm mirror and the proxy.
  agent_net:
    name: sdlc_agent_net
    internal: true
  egress: {}

volumes:
  pgdata: {}
  # Repository mirrors, ticket workspaces and run logs. Inside Docker (its VM on macOS and Windows), never on the host disk.
  data:
    name: sdlc_data
  npm_mirror:
    name: sdlc_npm_mirror
  # npm cache (mounted at /npm-cache) for agent containers outside a project folder. Each project gets its own sdlc_npm_cache_<id> volume, created on first use.
  npm_cache:
    name: sdlc_npm_cache
